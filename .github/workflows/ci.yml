name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      # Every test file in its own process, one per core (scripts/test.ts).
      - run: bun run test
      - name: CLI smoke test on Node
        run: |
          PULSAR_HOME="$(mktemp -d)"
          export PULSAR_HOME
          node dist/cli.js --version
          node dist/cli.js ls
          node dist/cli.js doctor || true
          node dist/cli.js stop

  e2e:
    name: e2e (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: chromium
            os: ubuntu-latest
            browsers: chromium
            workers: 2
            config: web/playwright.config.ts
            # Playwright prepends the project name to each test title.
            args: --grep-invert "^ios "
          - suite: ios
            os: macos-latest
            browsers: webkit
            workers: 1
            config: web/playwright.config.ts
            args: --project=ios
          - suite: real-daemon
            os: ubuntu-latest
            browsers: chromium webkit
            workers: 1
            config: web/playwright.real.config.ts
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      PULSAR_NO_SCAN: "1"
      PULSAR_E2E_WORKERS: ${{ matrix.workers }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - id: browsers
        uses: actions/cache@v4
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ matrix.suite }}-${{ hashFiles('bun.lock') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps ${{ matrix.browsers }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps ${{ matrix.browsers }}
      - run: bunx playwright test -c ${{ matrix.config }} ${{ matrix.args }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.suite }}
          path: web/test-results
          retention-days: 7
